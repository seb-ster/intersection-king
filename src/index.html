<title>Four-Way Intersection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* A Short Hike-inspired palette, now shifted to a cozy nighttime
     scene — deep indigo instead of daytime peach, warm cream lamplight
     for contrast. This is also what makes the headlight/signal light
     cones actually mean something visually instead of being a subtle
     daylight overlay. Nearly every drawn color in this game reads off
     these custom properties (via the css() helper in JS, or var() in
     CSS), so retinting here recolors the whole scene without touching
     any drawing logic. */
  :root {
    --asphalt: #1c1812;
    --block: #182016;
    --block-edge: #1c1830;
    --paint: #e8dcc0;
    --paint-dim: #8a8065;
    --red: #e0654f;
    --yellow: #e8b23f;
    --green: #8fb878;
    --hud-bg: rgba(28, 24, 48, 0.8);
    --hud-border: rgba(232, 220, 192, 0.18);
    --text: #f2e6c9;
    --text-dim: #a89a86;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--block-edge);
    color: var(--text);
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }

  canvas, .controls button {
    touch-action: manipulation; /* taps register instantly, no double-tap zoom */
  }

  .stage {
    position: relative;
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    aspect-ratio: 1 / 1;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    /* rendered at native device resolution with smoothing on (see
       resize()) — soft, antialiased shapes instead of the earlier
       chunky pixel-art look. */
    image-rendering: auto;
  }

  .controls {
    position: absolute;
    bottom: clamp(10px, 2vw, 22px);
    left: clamp(10px, 2vw, 22px);
    display: flex;
    gap: 6px;
  }

  .controls button {
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    border-radius: 6px;
    padding: 7px 11px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: border-color 0.15s, color 0.15s;
  }

  .controls button:hover { border-color: var(--green); color: var(--green); }
  .controls button:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }

  .leaderboard-title {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .leaderboard-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 12px;
    padding: 3px 0;
  }

  .leaderboard-row.me { color: var(--green); }

  .leaderboard-rank {
    color: var(--text-dim);
    width: 12px;
  }

  .leaderboard-score {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 34px;
  }

  .leaderboard-date {
    color: var(--text-dim);
    font-size: 10px;
    margin-left: auto;
  }

  .leaderboard-empty {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
  }

  .legend-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: auto;
  }

  .legend-backdrop.open { display: flex; }

  .legend {
    position: relative;
    background: #3a3050;
    border: 1px solid var(--hud-border);
    border-radius: 14px;
    padding: 18px;
    width: min(320px, 84vw);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  }

  /* Same modal chrome, just roomier for two leaderboard columns. */
  .legend.legend--wide { width: min(380px, 90vw); }

  .window-controls {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    gap: 8px;
  }

  .window-controls button {
    position: relative;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
  }

  .window-controls button::after {
    content: "";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    line-height: 1;
    font-weight: 700;
    color: rgba(0, 0, 0, 0.5);
    opacity: 0; /* revealed on hover, macOS-style */
  }

  .window-controls:hover button::after { opacity: 1; }
  .window-controls .wc-close::after { content: "×"; }
  .window-controls .wc-min::after { content: "−"; }
  .window-controls .wc-zoom::after { content: "+"; }

  .window-controls .wc-close { background: #ff5f57; }
  .window-controls .wc-min { background: #febc2e; }
  .window-controls .wc-zoom { background: #28c840; }

  .legend-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 18px 0 10px; /* clears the traffic-light row above it */
  }

  .legend-text {
    display: block;
    width: 100%;
    min-height: 110px;
    background: #f4f3ef;
    color: #1c1c1e;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.9;
    box-sizing: border-box;
  }

  .legend-text .num { font-weight: 700; }
  .legend-text .num.neg { color: #c0392b; }
  .legend-text .num.pos { color: #1e8449; }

  .legend-credits {
    margin-top: 12px;
    font-size: 9px;
    line-height: 1.5;
    color: var(--text-dim);
    opacity: 0.55;
    text-align: center;
  }

  .score {
    position: absolute;
    top: 32px; /* leaves room above for the help callout + its tail */
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    border-radius: 8px;
    padding: 6px 10px 6px 16px;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-help-btn {
    pointer-events: auto;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1px solid var(--hud-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 700;
    font-family: inherit;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }

  .score-help-btn:hover,
  .score-help-btn[aria-expanded="true"] {
    color: var(--text);
    border-color: var(--text-dim);
  }

  .score { cursor: pointer; }

  .score-hint {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--yellow);
    color: #1a1508;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    white-space: nowrap;
    padding: 4px 9px;
    border-radius: 5px;
    transition: opacity 0.15s;
  }

  .score.help-open .score-hint { opacity: 0; pointer-events: none; }

  .score-hint::before {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 5px solid var(--yellow);
  }

  .score-popup {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    font-weight: 700;
    color: var(--green);
    pointer-events: none;
    transition: top 0.9s ease-out, opacity 0.9s ease-out;
    opacity: 1;
  }

  /* The trophy needs to clear the whole score badge on its way up, not
     just nudge past its own start point, so it gets a taller rise, a
     longer float, and more visual weight than the plain +10/-10 popups. */
  .score-popup.trophy {
    font-size: 26px;
    transition: top 1.1s ease-out, opacity 1.1s ease-out;
  }

  /* A real crown graphic — not a badge — hung on the score field's
     corner for the rest of the session once a run cracks the global top
     5. Gold gradients + a drop-shadow give it some depth instead of
     reading as flat UI chrome. */
  .score-crown {
    position: absolute;
    top: -30px;
    right: -16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: auto;
    cursor: pointer;
    transform: rotate(10deg);
  }
  .score-crown[hidden] { display: none; }
  .crown-svg {
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 7px rgba(255, 193, 7, 0.4));
    transition: filter 0.15s, transform 0.15s;
    transform-origin: 50% 70%;
  }
  .score-crown:hover .crown-svg,
  .score-crown:focus-visible .crown-svg {
    transform: scale(1.1);
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 11px rgba(255, 193, 7, 0.7));
  }
  .crown-rank {
    margin-top: -7px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 700;
    color: var(--yellow);
    transform: rotate(-10deg);
  }

  /* The celebratory flourish that plays each time the rank badge above
     is (re)earned — a separate transient popup, same fade/float/fade
     mechanics as the trophy, with the new rank sitting beside the crown
     rather than in a pill underneath it. */
  .score-popup.crown-popup {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 15px;
    transition: top 1.1s ease-out, opacity 1.1s ease-out;
  }
  .score-popup.crown-popup svg {
    filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 7px rgba(255, 193, 7, 0.4));
  }
  .score-popup.crown-popup .crown-popup-rank {
    font-weight: 700;
    color: var(--yellow);
  }
</style>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let SIZE = 900, cx = SIZE / 2, cy = SIZE / 2;

// A Short Hike's own "pixel art" is actually this same trick: render at
// a lower internal resolution, then let the browser upscale it with
// smoothing (NOT nearest-neighbor) — the softening from that upscale
// blur is what reads as gentle, painterly chunkiness instead of either
// crisp native rendering or hard pixel-art edges. The CSS stays
// `image-rendering: auto` (see above) specifically so this blur happens;
// switching that to `pixelated` would turn this back into hard edges.
const INTERNAL_RES = 640;

function resize() {
  const rect = canvas.getBoundingClientRect();
  SIZE = rect.width;
  const scale = INTERNAL_RES / SIZE;
  canvas.width = INTERNAL_RES;
  canvas.height = INTERNAL_RES;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  cx = SIZE / 2; cy = SIZE / 2;
}
window.addEventListener("resize", resize);

function css(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}
function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
// Nudges a hex color's brightness up/down by a flat amount per channel —
// used to dither flat fills into a noisy pixel-block texture instead of
// one smooth rect.
function shadeHex(hex, amt) {
  const h = hex.replace("#", "");
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp(parseInt(h.substring(0, 2), 16) + amt);
  const g = clamp(parseInt(h.substring(2, 4), 16) + amt);
  const b = clamp(parseInt(h.substring(4, 6), 16) + amt);
  return `rgb(${r},${g},${b})`;
}
// A soft triangular glow, additively blended so overlapping cones brighten
// instead of just stacking flat color — used for both the traffic lights'
// beams and the cars' headlights.
function drawGlowCone(tipX, tipY, dirX, dirY, length, halfWidth, hexColor, peakAlpha) {
  const px = -dirY, py = dirX;
  const baseX = tipX + dirX * length, baseY = tipY + dirY * length;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  // A middle stop lets it fall off faster than a linear gradient would —
  // closer to how a real headlight's brightness actually decays with
  // distance, instead of an even wash of color.
  const grad = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, length);
  grad.addColorStop(0, hexToRgba(hexColor, peakAlpha));
  grad.addColorStop(0.4, hexToRgba(hexColor, peakAlpha * 0.35));
  grad.addColorStop(1, hexToRgba(hexColor, 0));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(baseX + px * halfWidth, baseY + py * halfWidth);
  ctx.lineTo(baseX - px * halfWidth, baseY - py * halfWidth);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ---------------- Geometry ---------------- */
const ROAD = () => SIZE * 0.30;
const LANES = 4;
const BOX = () => ROAD();
const CW_PAD = () => SIZE * 0.012;
const CW_HALF = () => SIZE * 0.025;
const STOP_LINE = () => BOX() / 2 + CW_PAD() + CW_HALF() + SIZE * 0.006;

let speed = 1, paused = false;

/* ---------------- Audio ----------------
   Everything here is synthesized live with Web Audio — no asset files,
   so it works the same in the Artifact and later in the Tauri/Steam
   build with zero licensing questions. AudioContext can't start until a
   real user gesture, so it's created lazily on first pointer/click. */
let audioCtx = null;
let masterGain = null;
// A real recorded horn honk (user-supplied MP3, base64-embedded so the
// artifact stays self-contained) instead of a synthesized tone — played

// made it sound like a sped-up tape rather than a real engine, so moving

/* ---------------- Leaderboard ----------------
   Local top-5 high scores, persisted across launches. One entry per play
   session (since the sim runs continuously with no "game over"), updated
   in place as the session's score climbs — so the board fills with real
   personal bests instead of spamming an entry per +10. */
const LEADERBOARD_KEY = "fourway-leaderboard";
const sessionId = Date.now() + Math.random();
let leaderboard = [];
try { leaderboard = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || "[]"); } catch { leaderboard = []; }

function recordSessionBest() {
  let entry = leaderboard.find((e) => e.session === sessionId);
  if (!entry) {
    entry = {session: sessionId, score, date: new Date().toLocaleDateString()};
    leaderboard.push(entry);
  } else if (score > entry.score) {
    entry.score = score;
    entry.date = new Date().toLocaleDateString();
  } else {
    return; // not a new best for this session — nothing to re-render
  }
  leaderboard.sort((a, b) => b.score - a.score);
  leaderboard = leaderboard.slice(0, 5);
  localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
  renderLeaderboard();
  maybePublishGlobalBest(score);
}

function renderLeaderboard() {
  const el = document.getElementById("leaderboard-list");
  if (!el) return;
  if (leaderboard.length === 0) {
    el.innerHTML = '<div class="leaderboard-empty">No scores yet — start driving.</div>';
    return;
  }
  el.innerHTML = leaderboard
    .map((e, i) => `<div class="leaderboard-row${e.session === sessionId ? ' me' : ''}">
      <span class="leaderboard-rank">${i + 1}</span>
      <span class="leaderboard-score">${e.score}</span>
      <span class="leaderboard-date">${e.date}</span>
    </div>`)
    .join("");
}

/* ---------------- Global leaderboard ----------------
   Shared across every viewer of this artifact, via the `artifact` runtime
   capability. The current top 5 lives embedded in the page's own HTML
   (so a fresh load has it with no fetch); a new global-best publishes a
   full replacement page with just that block updated. Publishing reloads
   every open view — so this only fires when a score genuinely beats the
   current global top 5, not on every point change. */
let globalScores = [];
try {
  globalScores = JSON.parse(document.getElementById("global-scores-data").textContent || "[]");
} catch { globalScores = []; }

// This session's own entry once it lands on the global board — used to
// highlight it in the list the same way "This device" highlights its own
// row, instead of leaving the player to hunt their score out by eye.
let myGlobalScore = null;

function renderGlobalLeaderboard() {
  const el = document.getElementById("global-leaderboard-list");
  if (!el) return;
  if (globalScores.length === 0) {
    el.innerHTML = '<div class="leaderboard-empty">No global scores yet.</div>';
    return;
  }
  let mineMarked = false;
  el.innerHTML = globalScores
    .map((e, i) => {
      const isMine = !mineMarked && e.score === myGlobalScore;
      if (isMine) mineMarked = true;
      return `<div class="leaderboard-row${isMine ? ' me' : ''}">
      <span class="leaderboard-rank">${i + 1}</span>
      <span class="leaderboard-score">${e.score}</span>
      <span class="leaderboard-date">${e.date}</span>
    </div>`;
    })
    .join("");
}

let claudeArtifact = null;
(async () => {

  catch { claudeArtifact = null; }
})();

let trophyShownThisSession = false;

  scoreCrownEl.hidden = false;
}

async function maybePublishGlobalBest(candidateScore) {
  const worseThanFull = globalScores.length >= 5 &&
    candidateScore <= globalScores[globalScores.length - 1].score;
  if (worseThanFull) return; // wouldn't change the global top 5 — skip the publish entirely

  // Reaching the leaderboard is worth celebrating even for a read-only
  // viewer who can't actually write the global list — show it once, not
  // again on every further +10 while already comfortably in the top 5.
  if (!trophyShownThisSession) {
    trophyShownThisSession = true;
    popScorePopup("🏆");
  }

  // A crown + rank badge hangs on the score field's corner for the rest
  // of the session (not just a passing popup), and updates in place if
  // the run climbs further within the top 5. The crown flourish (popup
  // + choir swell) plays every time, including on later rank improves.
  const rank = globalScores.filter((e) => e.score > candidateScore).length + 1;
  updateGlobalRankBadge(rank);
  showCrownPopup(rank);
  myGlobalScore = candidateScore;

  if (!claudeArtifact) { renderGlobalLeaderboard(); return; } // capability unavailable in this view — read-only

  const merged = [...globalScores, {score: candidateScore, date: new Date().toLocaleDateString()}]
    .sort((a, b) => b.score - a.score)
    .slice(0, 5);
  globalScores = merged;
  renderGlobalLeaderboard();

  try {
    const res = await fetch(location.href, {cache: "no-store"});
    const rawHtml = await res.text();
    const patched = rawHtml.replace(
      /<script id="global-scores-data" type="application\/json">[\s\S]*?<\/script>/,
      `<script id="global-scores-data" type="application/json">${JSON.stringify(merged)}<\/script>`
    );
    await claudeArtifact.publish(patched);
  } catch {
    // conflict / not_writer / offline — fine, the shell reloads on conflict
    // and a read-only viewer simply can't contribute; nothing to surface.
  }
}

const TRAVEL = {
  N: {x: 0, y: 1}, S: {x: 0, y: -1}, E: {x: -1, y: 0}, W: {x: 1, y: 0},
};
const PERP = {
  N: {x: -1, y: 0}, S: {x: 1, y: 0}, E: {x: 0, y: -1}, W: {x: 0, y: 1},
};
const ANGLE = {N: Math.PI / 2, S: -Math.PI / 2, E: Math.PI, W: 0};

// Which approach a car ends up traveling as once it's turned — derived
// from rotating each approach's own travel vector -90°/+90°. LEFT[N]='W'
// reads as: a car approaching from the north, turning left, ends up
// moving the same way a W-approach car does (east) — see carWorldPos,
// which switches a turning car onto this direction's TRAVEL/PERP once
// the turn arc completes.
const LEFT = {N: "W", S: "E", E: "N", W: "S"};
const RIGHT = {N: "E", S: "W", E: "S", W: "N"};

// Two lanes per approach (LANES/2): the inner lane (closer to the
// centerline) is the left-turn-or-straight lane, the outer lane is
// straight-or-right — same convention real intersections use, and it's
// what lets a turning car keep its lane NUMBER across the turn (so its
// offset from the road centerline, and thus its turn radius, stays
// identical on both sides — see spawnCar/carWorldPos).
const LANE_TURNS = [["left", "straight"], ["straight", "right"]];

function carAxisOffset(lane) {
  const w = ROAD() / LANES;
  return w * (lane + 0.5) - w * 0.15;
}

// Mostly-straight traffic with an occasional turn, weighted so the sim
// doesn't turn into a permanent gridlock of crossing paths.
function pickTurn() {
  const r = Math.random();
  if (r < 0.16) return "left";
  if (r < 0.32) return "right";
  return "straight";
}

function spawnCar(dir) {
  const turn = pickTurn();
  // Lane is picked to match the turn, not the other way round — a left
  // turn must spawn in the inner (left/straight) lane, a right turn in
  // the outer (straight/right) lane, straight traffic can use either.
  const lane = turn === "left" ? 0 : turn === "right" ? 1 : Math.floor(Math.random() * (LANES / 2));
  const newDir = turn === "left" ? LEFT[dir] : turn === "right" ? RIGHT[dir] : dir;
  const radius = carAxisOffset(lane);
  // Period-correct 1950s American pastels — turquoise, coral, mint,
  // butter yellow, powder blue — the palette every reference photo of
  // the era shows paired with white/cream trim.
  const colors = ["#6fb8b0", "#e8886a", "#8fbf8a", "#f0c15c", "#8fa8cf", "#e6a4b4"];
  const speedVal = SIZE * (0.10 + Math.random() * 0.02);
  const car = {
    id: nextCarId++, dir, lane,
    // How far before/after center the curve phase spans. The Bezier
    // control point (see carWorldPos) is only geometrically valid — on
    // the correct side to preserve entry/exit heading — once this
    // exceeds `radius`; a right turn's radius is the OUTER lane's offset
    // (can be fairly large), so a small fixed multiple of it (as opposed
    // to, say, a flat margin) was overshooting past the stop line for
    // wide lanes, leaving barely any visible curve inside the box —
    // which read as the car just driving straight through.
    turn, newDir, radius, turnR: radius * 1.3,
    pos: -SIZE * 0.62,
    speed: speedVal,
    curSpeed: speedVal, // eased toward 0 (or back to `speed`) instead of snapping — see stepCars
    color: colors[Math.floor(Math.random() * colors.length)],
    len: SIZE * 0.06, wid: SIZE * 0.036,
    waitTime: 0, latePenalized: false,
    engine: null, moving: true,
  };
  cars.push(car);
  startCarEngine(car);
}

// A turning car travels straight in its original lane until `pos` reaches
// -turnR, then follows a quadratic Bezier through the box, then continues
// straight in its new lane past +turnR. Left and right turns need
// genuinely different curve shapes — a left turn sweeps a wide arc past
// the middle, a right hugs the near corner tightly — so rather than
// special-case each one, the curve's control point is derived the same
// way for both: it's wherever the original lane's own straight line
// (extended forward) meets the destination lane's straight line (extended
// backward). A quadratic Bezier through that point is tangent to each
// lane at the point it meets it, which is exactly what keeps the car's
// heading continuous with its straight-line approach and departure — no
// heading jump, which is what was showing up as cars spinning through a
// U-turn mid-intersection.
function carWorldPos(car) {
  if (car.turn === "straight" || car.pos < -car.turnR) {
    const t = TRAVEL[car.dir], p = PERP[car.dir];
    const off = carAxisOffset(car.lane);
    return {
      x: cx + t.x * car.pos + p.x * off,
      y: cy + t.y * car.pos + p.y * off,
      ang: ANGLE[car.dir],
    };
  }
  if (car.pos > car.turnR) {
    const t = TRAVEL[car.newDir], p = PERP[car.newDir];
    return {
      x: cx + t.x * car.pos + p.x * car.radius,
      y: cy + t.y * car.pos + p.y * car.radius,
      ang: ANGLE[car.newDir],
    };
  }
  const R = car.turnR, r = car.radius;
  const T1 = TRAVEL[car.dir], P1 = PERP[car.dir];
  const T2 = TRAVEL[car.newDir], P2 = PERP[car.newDir];
  const ex = P1.x * r - T1.x * R, ey = P1.y * r - T1.y * R; // enter turn at original-lane pos = -R
  const xx = P2.x * r + T2.x * R, xy = P2.y * r + T2.y * R; // exit turn at new-lane pos = +R
  const dx = xx - ex, dy = xy - ey;
  const u = T1.x * dx + T1.y * dy; // (dx,dy) decomposed onto the perpendicular T1/T2 axes
  const cx2 = ex + T1.x * u, cy2 = ey + T1.y * u; // control point: where both lanes' lines meet
  const t = (car.pos + R) / (2 * R), mt = 1 - t;
  const px = mt * mt * ex + 2 * mt * t * cx2 + t * t * xx;
  const py = mt * mt * ey + 2 * mt * t * cy2 + t * t * xy;
  const dxT = 2 * mt * (cx2 - ex) + 2 * t * (xx - cx2);
  const dyT = 2 * mt * (cy2 - ey) + 2 * t * (xy - cy2);
  return {x: cx + px, y: cy + py, ang: Math.atan2(dyT, dxT)};
}

function stepCars(dt) {
  const stopLine = STOP_LINE();
  const clearLine = BOX() / 2;
  for (const dir of DIRS) {
    spawnTimer[dir] -= dt;
    if (spawnTimer[dir] <= 0) {
      spawnTimer[dir] = 0.9 + Math.random() * 1.6;
      const approachOk = cars.filter(c => c.dir === dir).every(c => c.pos < -SIZE * 0.5);
      if (approachOk || cars.filter(c => c.dir === dir).length === 0) spawnCar(dir);
    }
  }

  for (const dirGroup of DIRS) {
    // Front-most car (closest to/through the intersection) first, so each
    // car behind it checks its gap against whoever is actually ahead of
    // it — not the car behind, which is what let queued cars drive
    // straight through each other before.
    const group = cars.filter(c => c.dir === dirGroup).sort((a, b) => b.pos - a.pos);
    const signal = lightEffectiveSignal(dirGroup); // every lane obeys its own light now
    let prevPos = Infinity;
    let nowQueued = 0;
    let backOfQueue = null; // farthest-back blocked car — the newest arrival
    for (const car of group) {
      const gapOk = prevPos - car.pos > car.len * 2.6;
      // Only cars still approaching (haven't reached the box yet) obey a
      // red — once a car has entered the intersection it's committed and
      // keeps going, exactly like a real light. Without the `-clearLine`
      // cap here, flipping a light red mid-crossing would freeze a car
      // stuck in the middle of the intersection instead of letting it
      // clear through.
      //
      // The back edge of this zone is pulled out by a full braking
      // distance (`car.speed`, since easing to 0 over BRAKE_TIME at a
      // constant rate covers avg-speed * time = speed * BRAKE_TIME/2,
      // and BRAKE_TIME is 2s so that's just `car.speed`) — otherwise a
      // car told to stop only once already at the line wouldn't have
      // room to actually slow down before it, and would coast into the
      // box mid-brake.
      const atLine = car.pos >= -stopLine - car.len - car.speed && car.pos < -clearLine;
      const mustStop = (signal === "red" || signal === "yellow") && atLine;
      const canMove = gapOk && !mustStop;
      updateCarEngine(car, canMove);
      car.moving = canMove; // brake lights / engine note react the instant braking is commanded, not once fully stopped

      // Ease toward the target speed instead of snapping — 2s to come to
      // a full stop, a bit quicker (0.8s) to get back up to cruising
      // speed once clear to go.
      const targetSpeed = canMove ? car.speed : 0;
      const maxDelta = (canMove ? car.speed / 0.8 : car.speed / 2) * dt;
      if (car.curSpeed < targetSpeed) car.curSpeed = Math.min(targetSpeed, car.curSpeed + maxDelta);
      else if (car.curSpeed > targetSpeed) car.curSpeed = Math.max(targetSpeed, car.curSpeed - maxDelta);
      if (car.curSpeed > 0) car.pos += car.curSpeed * dt;

      // The squeal sustains for exactly as long as the car is actually
      // decelerating — starts the instant braking begins, stops the
      // instant it's fully stopped (or told to go again mid-brake).
      const decelerating = !canMove && car.curSpeed > 0.001;
      if (decelerating && !car.squeal) startSqueal(car);
      else if (!decelerating && car.squeal) stopSqueal(car);
      // Safety cap — braking should always finish well under this, but
      // if anything ever kept a car "decelerating" indefinitely, don't
      // let its squeal ring forever.
      else if (car.squeal && audioCtx && audioCtx.currentTime - car.squeal.startTime > 3) stopSqueal(car);

      if (canMove) {
        car.waitTime = 0;
        car.latePenalized = false;
      } else if (signal === "red" || signal === "yellow") {
        // blocked while red — either right at the line, or stuck behind
        // another car that is, which still counts as part of the queue.
        // We're iterating front-to-back, so the last one we overwrite
        // onto `backOfQueue` ends up the farthest back — the newest
        // arrival.
        nowQueued++;
        backOfQueue = car;

        car.waitTime += dt;
        if (car.waitTime > 10 && !car.latePenalized) {
          car.latePenalized = true;
          score -= 10;
          updateScore();
          playScoreChime(false);
          const wp = carWorldPos(car);
          floaters.push({x: wp.x, y: wp.y, t: 0, text: "-10", color: "red"});
        }
      }
      prevPos = car.pos;
    }

    if (nowQueued > queueLen[dirGroup] && queueLen[dirGroup] >= 1 && backOfQueue) {
      const wp = carWorldPos(backOfQueue);
      floaters.push({x: wp.x, y: wp.y, t: 0, text: "-10", color: "red"});
      score -= 10;
      updateScore();
      playScoreChime(false);
    }
    queueLen[dirGroup] = nowQueued;
  }

  for (const f of floaters) f.t += dt;
  floaters = floaters.filter(f => f.t < 1.1);

  checkCollisions(dt);

  // Reward every car that actually makes it through and clears the far
  // side — crashed cars never reach here, they're removed on impact.
  const cleared = cars.filter(c => c.pos >= SIZE * 0.62);
  for (const c of cleared) {
    popScorePopup("+10");
    score += 10;
    playScoreChime(true);
    stopCarEngine(c);
    stopSqueal(c);
  }
  if (cleared.length) updateScore();

  cars = cars.filter(c => c.pos < SIZE * 0.62);
}

// Straight streams only ever meet inside the box, which happens when the
// player leaves two crossing lights green at once — turning cars add a
// second way to collide (swinging into a same/opposite-dir car's path).
// Either way that's the actual risk being modeled: independent manual
// lights only stay safe if you keep conflicting approaches from going
// green together.
// Cars that crash are removed from the sim immediately — a lingering wreck
// used to sit in the lane as a physical obstacle, which just caused a
// second pileup as other traffic ran into IT. The crash still gets a
// visual (a brief spark burst, decoupled from any car object), just no
// longer a hazard of its own.
let crashBursts = [];
// Global cooldown (not per-car) so a busy intersection with several close
// calls at once doesn't stack the horn sample on top of itself.
let lastHornTime = -Infinity;

// N/S and E/W each share one road but run opposite ways in parallel lanes
// — they pass close together at the middle of the intersection but never
// actually cross paths, so they're excluded here the same as same-dir
// pairs. Only genuinely crossing pairs (e.g. N vs E) can collide.
const OPPOSITE_DIR = {N: "S", S: "N", E: "W", W: "E"};

function checkCollisions(dt) {
  const toRemove = new Set();
  for (let i = 0; i < cars.length; i++) {
    const a = cars[i];
    if (toRemove.has(a)) continue;
    const pa = carWorldPos(a);
    for (let j = i + 1; j < cars.length; j++) {
      const b = cars[j];
      // same lane, or opposite-direction parallel lanes — neither pair
      // ever actually crosses paths, so skip both. Only holds when both
      // cars are going straight, though — a turning car swings out of its
      // own lane and can cross a same/opposite-dir car's path, so this
      // shortcut can't apply to it.
      if (toRemove.has(b)) continue;
      const bothStraight = a.turn === "straight" && b.turn === "straight";
      if (bothStraight && (a.dir === b.dir || OPPOSITE_DIR[a.dir] === b.dir)) continue;
      const pb = carWorldPos(b);
      // A generous full-length threshold — two fast cars crossing at
      // right angles can close more distance in one frame than a tight
      // radius would ever catch, letting them tunnel past each other
      // without ever registering as "touching".
      const threshold = (a.len + b.len) / 2;
      const dist = Math.hypot(pa.x - pb.x, pa.y - pb.y);
      if (dist < threshold) {
        toRemove.add(a); toRemove.add(b);
        crashBursts.push({x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2, t: 0});
        floaters.push({x: (pa.x + pb.x) / 2, y: (pa.y + pb.y) / 2, t: 0, text: "-50", color: "red"});
        score -= 50;
        updateScore();
        playCrashThud();
      } else if (dist < threshold * 1.7 && audioCtx && audioCtx.currentTime - lastHornTime > 0.4) {
        // A wider "about to hit" zone, just outside the actual crash
        // radius — a warning honk right before impact, not simultaneous
        // with the thud.
        lastHornTime = audioCtx.currentTime;
        playHorn();
      }
    }
  }
  if (toRemove.size) {
    for (const c of toRemove) { stopCarEngine(c); stopSqueal(c); }
    cars = cars.filter(c => !toRemove.has(c));
  }

  for (const b of crashBursts) b.t += dt;
  crashBursts = crashBursts.filter((b) => b.t < 0.6);
}

/* ---------------- Traffic lights ----------------
   Four independent, tappable lights — one per approach — each following
   the Austrian/EU convention: red never jumps straight to green (a brief
   red+yellow first), green never jumps straight to red (a brief yellow
   first). Each one actually governs its own lane's traffic; there's no
   automatic cycle anymore, it's fully manual. Placed on opposite corners
   so a light's arrow always points the way its lane actually travels. */
const LIGHT_CORNER = {S: "SE", N: "NW", W: "SW", E: "NE"};
const CORNER_SIGN = {NW: [-1, -1], NE: [1, -1], SW: [-1, 1], SE: [1, 1]};
// Arrow direction = direction of travel for that approach's lane.
const ARROW_DIR = {S: [0, -1], N: [0, 1], W: [1, 0], E: [-1, 0]};

const STOPPED = "stopped", GOING = "going";
const STAGE_STEADY = null, STAGE_RY = "redyellow", STAGE_Y = "yellow";
const STAGE_MS = 700;

const lights = {};
for (const dir of DIRS) {
  lights[dir] = {state: STOPPED, stage: STAGE_STEADY, stageUntil: 0, badgeUntil: 0};
}

// NS-governing lights stand upright (lamps stacked); EW-governing lights
// lie on their side (lamps in a row) — the housing itself echoes the axis
// of the lane it controls, not just the arrow underneath it.
const HOUSING_AXIS = {N: "v", S: "v", E: "h", W: "h"};

// How far each light sits into its corner block, as a fraction of the
// block's width — smaller means closer to the road. High enough to clear
// the buildings' deepest possible reach (see BUILDING_RUN_LEN/packBuildings'
// `depth`), so the light housing sits out past the storefronts, near the
// actual corner, rather than overlapping them.
const LIGHT_INSET = {N: 0.8, S: 0.8, E: 0.8, W: 0.8};

function lightGeometry(dir) {
  const corner = LIGHT_CORNER[dir];
  const [qx, qy] = CORNER_SIGN[corner];
  const b = BOX() / 2, m = SIZE * 0.02;
  const cwid = SIZE / 2 - b - m;
  const short = SIZE * 0.022, long = SIZE * 0.056;
  const horizontal = HOUSING_AXIS[dir] === "h";
  const inset = cwid * LIGHT_INSET[dir];
  return {
    x: cx + qx * (b + m + inset),
    y: cy + qy * (b + m + inset),
    w: horizontal ? long : short,
    h: horizontal ? short : long,
    horizontal,
    r: SIZE * 0.038,
  };
}

function lightLitColors(dir) {
  const L = lights[dir];
  if (L.stage === STAGE_RY) return ["red", "yellow"];
  if (L.stage === STAGE_Y) return ["yellow"];
  return [L.state === STOPPED ? "red" : "green"];
}
function lightEffectiveSignal(dir) {
  const L = lights[dir];
  if (L.stage === STAGE_RY) return "red";
  if (L.stage === STAGE_Y) return "yellow";
  return L.state === STOPPED ? "red" : "green";
}
function tapLight(dir) {
  const L = lights[dir];
  if (performance.now() < L.stageUntil) return; // mid-transition — ignore
  L.stage = L.state === STOPPED ? STAGE_RY : STAGE_Y;
  L.stageUntil = performance.now() + STAGE_MS;
  L.badgeUntil = performance.now() + STAGE_MS + 900;
  playLightTick();
}
function stepLights() {
  for (const dir of DIRS) {
    const L = lights[dir];
    if (L.stage !== STAGE_STEADY && performance.now() >= L.stageUntil) {
      L.state = L.state === STOPPED ? GOING : STOPPED;
      L.stage = STAGE_STEADY;
    }
  }
}

const LAMP_COLOR = {red: () => css("--red"), yellow: () => css("--yellow"), green: () => css("--green")};

// A thin shaft plus a sharp filled triangular head, instead of the old
// blunt round-capped chevron — reads as crisp, precise linework rather
// than a chunky blob at this pixel-art resolution.
function drawArrow(x, y, dx, dy) {
  const len = SIZE * 0.014, hw = SIZE * 0.0045;
  const px = -dy, py = dx;

  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = SIZE * 0.0032;
  ctx.lineCap = "butt";
  ctx.beginPath();
  ctx.moveTo(x - dx * len, y - dy * len);
  ctx.lineTo(x + dx * len * 0.5, y + dy * len * 0.5);
  ctx.stroke();

  const tipX = x + dx * len, tipY = y + dy * len;
  const backX = x + dx * len * 0.42, backY = y + dy * len * 0.42;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(backX + px * hw, backY + py * hw);
  ctx.lineTo(backX - px * hw, backY - py * hw);
  ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fill();
}

// A shaft that curves toward the turn side and ends in an arrowhead
// pointing that way — the same weight/alpha as drawArrow's straight
// glyph so the two read as one family of road-paint markings. `side`
// is -1 for a left-bending glyph, +1 for right, relative to (dx,dy).
function drawBentArrow(x, y, dx, dy, side) {
  const sx = side < 0 ? dy : -dy, sy = side < 0 ? -dx : dx;
  const len = SIZE * 0.013, hw = SIZE * 0.004;

  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = SIZE * 0.003;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - dx * len, y - dy * len);
  ctx.quadraticCurveTo(x, y, x + sx * len * 0.85, y + sy * len * 0.85);
  ctx.stroke();

  const tipX = x + sx * len * 0.85, tipY = y + sy * len * 0.85;
  const backX = tipX - sx * len * 0.3, backY = tipY - sy * len * 0.3;
  const px = -sy, py = sx;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(backX + px * hw, backY + py * hw);
  ctx.lineTo(backX - px * hw, backY - py * hw);
  ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fill();
}

function drawLight(dir) {
  const {x: cxr, y: cyr, w, h, horizontal} = lightGeometry(dir);
  const lit = lightLitColors(dir);
  const lampR = Math.min(w, h) * 0.28;

  ctx.save();
  ctx.fillStyle = "#0c0c10";
  ctx.strokeStyle = "rgba(232,230,222,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(cxr - w / 2, cyr - h / 2, w, h, Math.min(w, h) * 0.3);
  ctx.fill(); ctx.stroke();

  ["red", "yellow", "green"].forEach((name, i) => {
    const lx = horizontal ? cxr - w / 2 + w * (i + 0.5) / 3 : cxr;
    const ly = horizontal ? cyr : cyr - h / 2 + h * (i + 0.5) / 3;
    const on = lit.includes(name);
    const color = LAMP_COLOR[name]();
    ctx.beginPath();
    ctx.arc(lx, ly, lampR, 0, Math.PI * 2);
    if (on) {
      ctx.shadowColor = color; ctx.shadowBlur = SIZE * 0.02;
      ctx.fillStyle = color;
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(232,230,222,0.10)";
    }
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // directional arrow just past the housing, showing which lane this
  // light actually governs (the direction that lane's traffic travels) —
  // plus a small left/right glyph flanking it, since this one light
  // governs both of that approach's lanes and (per LANE_TURNS) one of
  // them permits a turn each way.
  const [adx, ady] = ARROW_DIR[dir];
  const abx = cxr, aby = cyr + h / 2 + SIZE * 0.016;
  drawArrow(abx, aby, adx, ady);
  const apx = -ady, apy = adx;
  drawBentArrow(abx - apx * SIZE * 0.016, aby - apy * SIZE * 0.016, adx, ady, -1);
  drawBentArrow(abx + apx * SIZE * 0.016, aby + apy * SIZE * 0.016, adx, ady, 1);
  ctx.restore();

  if (performance.now() < lights[dir].badgeUntil) {
    const bx = cxr, by = cyr - h / 2 - SIZE * 0.03;
    const swatches = lit.map((n) => LAMP_COLOR[n]());
    const dot = SIZE * 0.007, gap = SIZE * 0.006;
    const bw = swatches.length * dot * 2 + (swatches.length - 1) * gap + SIZE * 0.02;
    const bh = SIZE * 0.036;
    ctx.save();
    ctx.fillStyle = "rgba(20,20,23,0.9)";
    ctx.strokeStyle = "rgba(232,230,222,0.25)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(bx - bw / 2, by - bh / 2, bw, bh, SIZE * 0.009);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx - SIZE * 0.006, by + bh / 2);
    ctx.lineTo(bx + SIZE * 0.006, by + bh / 2);
    ctx.lineTo(bx, by + bh / 2 + SIZE * 0.008);
    ctx.closePath();
    ctx.fillStyle = "rgba(20,20,23,0.9)";
    ctx.fill();
    const startX = bx - (swatches.length - 1) * (dot + gap) / 2;
    swatches.forEach((c, i) => {
      ctx.beginPath();
      ctx.fillStyle = c;
      ctx.shadowColor = c; ctx.shadowBlur = SIZE * 0.01;
      ctx.arc(startX + i * (dot * 2 + gap), by, dot, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }
}

function drawLights() {
  for (const dir of DIRS) drawLight(dir);
}

// A soft colored beam cast from each light into the lane it governs —
// red/yellow/green, same as the lamp — so the signal reads even at a
// glance across the intersection, not just up close on the housing.
// An omnidirectional soft glow around each light housing instead of a
// directional beam — simpler and reads as ambient lamplight, not a
// spotlight aimed anywhere in particular.
function drawLightCones() {
  for (const dir of DIRS) {
    const {x, y} = lightGeometry(dir);
    const signal = lightEffectiveSignal(dir);
    const color = LAMP_COLOR[signal]();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const r = SIZE * 0.065;
    // A middle stop so the glow falls off faster near the source and
    // fades gently at the edge, instead of a flat wash of color — the
    // single-stop gradient read as an artificial disc rather than light.
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, hexToRgba(color, 0.22));
    grad.addColorStop(0.45, hexToRgba(color, 0.09));
    grad.addColorStop(1, hexToRgba(color, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Each of the four corner blocks gets its own subtle tint instead of one
// flat color for the whole scene — the same trick A Short Hike uses to
// make each area feel distinct (warm near the beach, cool in the
// mountains) even though it's really one small, contiguous space.
const CORNER_TINT = {
  NE: "#2a2016", // warm, lamplit
  NW: "#16202a", // cool, moonlit
  SE: "#182818", // soft green, close to the original night block color
  SW: "#201828", // soft purple, echoes --block-edge
};

// Storefronts lining each side of both roads — mostly plain stores, with
// an occasional cafe or bar picked out by a warmer/darker awning color.
// Sizes are stored as SIZE-multipliers (not raw pixels), and the actual
// random pick of widths/types/gaps happens once here at load, not per
// frame — like the cars' colors, the "town" needs to hold still and feel
// like a real place, not reroll itself every draw.
const BUILDING_ROOF = ["#5a4636", "#4a3d33", "#6b5344", "#3f3a32", "#544838"];
const BUILDING_KINDS = [
  {weight: 6, awning: "#7a6a52"}, // store
  {weight: 2, awning: "#a4443a"}, // cafe
  {weight: 1, awning: "#5a2a3a"}, // bar
];
function pickBuildingKind() {
  const total = BUILDING_KINDS.reduce((s, k) => s + k.weight, 0);
  let r = Math.random() * total;
  for (const k of BUILDING_KINDS) { if ((r -= k.weight) < 0) return k; }
  return BUILDING_KINDS[0];
}
// How far each straight run of buildings has to fill: half the canvas
// minus half the road width minus a sidewalk gap on the road side and a
// margin on the canvas-edge side — fixed as a fraction of SIZE, so every
// run packs identically regardless of actual canvas pixel size.
const BUILDING_RUN_LEN = 0.5 - 0.15 - 0.02 - 0.02;
// Roughly one "pixel" cell as a fraction of SIZE — each building's roof
// gets tiled into a grid of these instead of one flat rect, each cell's
// shade jittered a bit, so it reads as a coarse pixel-art texture rather
// than clean vector fills. The outermost row/column away from the road
// (the building's skyline edge, the one silhouetted against open block
// tint rather than sitting flush against the sidewalk) randomly drops
// cells too, so that edge comes out jagged instead of a ruler-straight line.
const BUILDING_CELL = 0.011;
function packBuildings(maxLen) {
  const list = [];
  let used = 0;
  while (used < maxLen) {
    const width = 0.045 + Math.random() * 0.03;
    if (used + width > maxLen) break;
    const gap = 0.008 + Math.random() * 0.008;
    const depth = 0.05 + Math.random() * 0.035;
    const along = Math.max(3, Math.round(width / BUILDING_CELL));
    const across = Math.max(3, Math.round(depth / BUILDING_CELL));
    list.push({
      offset: used, width, depth, along, across,
      texture: Array.from({length: along * across}, () => (Math.random() - 0.5) * 16),
      farJitter: Array.from({length: along}, () => Math.random()),
      roof: BUILDING_ROOF[Math.floor(Math.random() * BUILDING_ROOF.length)],
      awning: pickBuildingKind().awning,
    });
    used += width + gap;
  }
  return list;
}
const buildingLayout = {
  north: {left: packBuildings(BUILDING_RUN_LEN), right: packBuildings(BUILDING_RUN_LEN)},
  south: {left: packBuildings(BUILDING_RUN_LEN), right: packBuildings(BUILDING_RUN_LEN)},
  west: {top: packBuildings(BUILDING_RUN_LEN), bottom: packBuildings(BUILDING_RUN_LEN)},
  east: {top: packBuildings(BUILDING_RUN_LEN), bottom: packBuildings(BUILDING_RUN_LEN)},
};

// `side` is which road edge this run faces (its buildings extend away
// from that edge, into the block); `baseline` is that edge's fixed
// coordinate and `start` is where the run begins along the road.
function drawBuildingRun(list, side, baseline, start) {
  for (const b of list) {
    const off = start + b.offset * SIZE, width = b.width * SIZE, depth = b.depth * SIZE;
    const stripW = SIZE * 0.01;
    // `horiz`: the building's along-the-road axis is x (true, for N/S
    // runs) or y (false, for W/E runs). `farAtMin`: whether the skyline
    // (away-from-road) edge sits at the smaller or larger coordinate.
    let x, y, w, h, awn, horiz, farAtMin;
    if (side === "N") { x = off; w = width; y = baseline - depth; h = depth; awn = [x, baseline - stripW, w, stripW]; horiz = true; farAtMin = true; }
    else if (side === "S") { x = off; w = width; y = baseline; h = depth; awn = [x, baseline, w, stripW]; horiz = true; farAtMin = false; }
    else if (side === "W") { y = off; h = width; x = baseline - depth; w = depth; awn = [baseline - stripW, y, stripW, h]; horiz = false; farAtMin = true; }
    else { y = off; h = width; x = baseline; w = depth; awn = [baseline, y, stripW, h]; horiz = false; farAtMin = false; }

    const cellAlong = (horiz ? w : h) / b.along;
    const cellAcross = (horiz ? h : w) / b.across;
    for (let ci = 0; ci < b.across; ci++) {
      const isFarRow = farAtMin ? ci === 0 : ci === b.across - 1;
      for (let ai = 0; ai < b.along; ai++) {
        if (isFarRow && b.farJitter[ai] < 0.22) continue;
        ctx.fillStyle = shadeHex(b.roof, b.texture[ci * b.along + ai]);
        if (horiz) ctx.fillRect(x + ai * cellAlong, y + ci * cellAcross, cellAlong + 0.6, cellAcross + 0.6);
        else ctx.fillRect(x + ci * cellAcross, y + ai * cellAlong, cellAcross + 0.6, cellAlong + 0.6);
      }
    }

    // awning as alternating light/dark blocks (a striped canopy) instead
    // of one flat bar — same pixel-block treatment as the roof above.
    const [ax, ay, aw, ah] = awn;
    const awningCells = Math.max(3, Math.round((horiz ? w : h) / (SIZE * 0.012)));
    for (let i = 0; i < awningCells; i++) {
      ctx.fillStyle = i % 2 === 0 ? b.awning : shadeHex(b.awning, -18);
      if (horiz) ctx.fillRect(ax + (i / awningCells) * aw, ay, aw / awningCells + 0.6, ah);
      else ctx.fillRect(ax, ay + (i / awningCells) * ah, aw, ah / awningCells + 0.6);
    }

    // one small warm-lit window per building — enough to read as an
    // occupied storefront at night without turning into pixel clutter.
    ctx.fillStyle = "rgba(255,214,140,0.55)";
    const dot = Math.min(w, h) * 0.16;
    ctx.fillRect(x + w / 2 - dot / 2, y + h / 2 - dot / 2, dot, dot);
  }
}

function drawBuildings() {
  const half = ROAD() / 2, marginEdge = SIZE * 0.02, marginRoad = SIZE * SIDEWALK_W;
  drawBuildingRun(buildingLayout.north.left, "N", cy - half - marginRoad, marginEdge);
  drawBuildingRun(buildingLayout.north.right, "N", cy - half - marginRoad, cx + half + marginRoad);
  drawBuildingRun(buildingLayout.south.left, "S", cy + half + marginRoad, marginEdge);
  drawBuildingRun(buildingLayout.south.right, "S", cy + half + marginRoad, cx + half + marginRoad);
  drawBuildingRun(buildingLayout.west.top, "W", cx - half - marginRoad, marginEdge);
  drawBuildingRun(buildingLayout.west.bottom, "W", cx - half - marginRoad, cy + half + marginRoad);
  drawBuildingRun(buildingLayout.east.top, "E", cx + half + marginRoad, marginEdge);
  drawBuildingRun(buildingLayout.east.bottom, "E", cx + half + marginRoad, cy + half + marginRoad);
}

/* ---------------- Roads & crossings ---------------- */
// A small noise tile, painted once and reused as a repeating fill
// pattern, instead of one flat asphalt color — reads as worn, speckled
// blacktop rather than a clean vector fill. Built lazily (needs a live
// 2D context to paint into and to turn into a pattern), then cached.
let asphaltPattern = null;
function getAsphaltPattern() {
  if (asphaltPattern) return asphaltPattern;
  const S = 40;
  const tile = document.createElement("canvas");
  tile.width = S; tile.height = S;
  const tctx = tile.getContext("2d");
  tctx.fillStyle = css("--asphalt") || "#1c1812";
  tctx.fillRect(0, 0, S, S);
  // Speckles that overflow an edge get a wrapped copy drawn on the
  // opposite side, so a tile edge never lands mid-speckle — a plain
  // random scatter tiled naively shows up as a visible seam grid once
  // repeated across the whole road.
  for (let i = 0; i < 150; i++) {
    const w = 1 + Math.random(), h = 1 + Math.random();
    const x = Math.random() * S, y = Math.random() * S;
    tctx.fillStyle = Math.random() < 0.55 ? "rgba(0,0,0,0.22)" : "rgba(255,255,255,0.06)";
    const xs = x + w > S ? [x, x - S] : [x];
    const ys = y + h > S ? [y, y - S] : [y];
    for (const xx of xs) for (const yy of ys) tctx.fillRect(xx, yy, w, h);
  }
  asphaltPattern = ctx.createPattern(tile, "repeat");
  return asphaltPattern;
}

function drawRoadSurface() {
  const half = ROAD() / 2;
  ctx.fillStyle = CORNER_TINT.NW;
  ctx.fillRect(0, 0, cx - half, cy - half);
  ctx.fillStyle = CORNER_TINT.NE;
  ctx.fillRect(cx + half, 0, SIZE - (cx + half), cy - half);
  ctx.fillStyle = CORNER_TINT.SW;
  ctx.fillRect(0, cy + half, cx - half, SIZE - (cy + half));
  ctx.fillStyle = CORNER_TINT.SE;
  ctx.fillRect(cx + half, cy + half, SIZE - (cx + half), SIZE - (cy + half));

  ctx.fillStyle = getAsphaltPattern();
  ctx.fillRect(cx - ROAD() / 2, 0, ROAD(), SIZE);
  ctx.fillRect(0, cy - ROAD() / 2, SIZE, ROAD());
}

// A light-grey curb strip framing the road on all four sides, sitting in
// the same gap the buildings' `marginRoad` already leaves clear (see
// drawBuildings) — so it reads as the sidewalk those storefronts front
// onto, rather than empty block tint between road and buildings.
const SIDEWALK_W = 0.02; // matches BUILDING drawBuildings' marginRoad, as a SIZE-fraction
function drawSidewalks() {
  const half = ROAD() / 2, sw = SIZE * SIDEWALK_W;
  ctx.fillStyle = "rgba(168,166,158,0.55)";
  ctx.fillRect(0, cy - half - sw, SIZE, sw);
  ctx.fillRect(0, cy + half, SIZE, sw);
  ctx.fillRect(cx - half - sw, 0, sw, SIZE);
  ctx.fillRect(cx + half, 0, sw, SIZE);
}

// Lane dividers, stop lines, and directional arrows — all "markings",
// pulled into one function so draw() can render them faintly for
// ambient visibility, then redraw them at full strength clipped to each
// car's headlight cone. ctx.globalAlpha (set by the caller) governs how
// strongly they show up each time.
function drawRoadMarkings() {
  ctx.strokeStyle = css("--paint-dim");
  ctx.lineWidth = SIZE * 0.0025;
  ctx.setLineDash([SIZE * 0.018, SIZE * 0.014]);
  const w = ROAD() / LANES, b = BOX() / 2;
  for (let i = 1; i < LANES; i++) {
    if (i === LANES / 2) continue;
    const off = -ROAD() / 2 + w * i;
    ctx.beginPath();
    ctx.moveTo(cx + off, 0); ctx.lineTo(cx + off, cy - b); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + off, cy + b); ctx.lineTo(cx + off, SIZE); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, cy + off); ctx.lineTo(cx - b, cy + off); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + b, cy + off); ctx.lineTo(SIZE, cy + off); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.lineWidth = SIZE * 0.003;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, cy - b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + b); ctx.lineTo(cx, SIZE); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(cx - b, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + b, cy); ctx.lineTo(SIZE, cy); ctx.stroke();

  ctx.strokeStyle = css("--paint");
  ctx.lineWidth = SIZE * 0.007;
  const sl = b + SIZE * 0.006;
  ctx.beginPath(); ctx.moveTo(cx - ROAD() / 2, cy - sl); ctx.lineTo(cx, cy - sl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + sl); ctx.lineTo(cx + ROAD() / 2, cy + sl); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + sl, cy - ROAD() / 2); ctx.lineTo(cx + sl, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - sl, cy); ctx.lineTo(cx - sl, cy + ROAD() / 2); ctx.stroke();

  drawLaneArrows();
}

// Pavement direction arrows — one per lane, same glyph as the light
// arrows — so every lane visibly shows which way its own traffic (and
// its light) moves, not just the four housings at the corners. The lane
// closest to the stop line also gets a small bent glyph showing which
// turn (if any) that lane permits, matching LANE_TURNS/spawnCar.
function drawLaneArrows() {
  const stopLine = STOP_LINE();
  for (const dir of DIRS) {
    const t = TRAVEL[dir], p = PERP[dir];
    for (let lane = 0; lane < LANES / 2; lane++) {
      const off = carAxisOffset(lane);
      for (const dist of [stopLine + SIZE * 0.05, stopLine + SIZE * 0.16]) {
        const x = cx - t.x * dist + p.x * off;
        const y = cy - t.y * dist + p.y * off;
        drawArrow(x, y, t.x, t.y);
      }
      const turns = LANE_TURNS[lane];
      const bendSide = turns.includes("left") ? -1 : 1;
      const bx = cx - t.x * (stopLine + SIZE * 0.02) + p.x * off;
      const by = cy - t.y * (stopLine + SIZE * 0.02) + p.y * off;
      drawBentArrow(bx, by, t.x, t.y, bendSide);
    }
  }
}

// Shared cone geometry — used both to paint the actual glow and to clip
// road markings so they only read where a headlight is actually falling.
// One cone per actual headlight (left + right), not a single centered
// beam — matches the two headlight lamps drawn on the car, and reads as
// a proper set of headlights rather than one eye in the middle of the
// bumper. Each cone flares outward as it travels so together they cover
// a wide swath of road ahead.
function carHeadlightGeom(car) {
  const wp = carWorldPos(car);
  const dx = Math.cos(wp.ang), dy = Math.sin(wp.ang);
  const px = -dy, py = dx;
  const lampOffset = car.wid * 0.32;
  const noseX = wp.x + dx * (car.len / 2), noseY = wp.y + dy * (car.len / 2);
  const length = car.len * 2.6, halfWidth = car.wid * 1.1;
  return [1, -1].map((side) => ({
    tipX: noseX + px * lampOffset * side,
    tipY: noseY + py * lampOffset * side,
    dx, dy, length, halfWidth,
  }));
}

// A warm headlight beam cast forward from the front bumper — drawn onto
// the road before the car itself, so it reads as light falling ahead of
// the car rather than a glow painted over the top of it.
function drawCarHeadlightCones() {
  for (const car of cars) {
    for (const {tipX, tipY, dx, dy, length, halfWidth} of carHeadlightGeom(car)) {
      drawGlowCone(tipX, tipY, dx, dy, length, halfWidth, "#fff6d8", 0.22);
    }
  }
}

function drawCars() {
  for (const car of cars) {
    const wp = carWorldPos(car);
    const L = car.len, Wd = car.wid;
    const braking = car.moving === false; // stopped or queued — lights stay on, not just a blip
    ctx.save();
    ctx.translate(wp.x, wp.y);
    ctx.rotate(wp.ang);

    // wheels — small dark blocks peeking past the body at front and rear,
    // each with a whitewall stripe (a 1950s tire, not a modern black one)
    ctx.fillStyle = "#111114";
    const wheelW = L * 0.15, wheelH = Wd * 0.18;
    for (const wx of [-L * 0.28, L * 0.28]) {
      ctx.fillRect(wx - wheelW / 2, -Wd / 2 - wheelH * 0.32, wheelW, wheelH);
      ctx.fillRect(wx - wheelW / 2, Wd / 2 - wheelH * 0.68, wheelW, wheelH);
    }
    ctx.fillStyle = "rgba(232,226,208,0.85)";
    const wwH = wheelH * 0.22;
    for (const wx of [-L * 0.28, L * 0.28]) {
      ctx.fillRect(wx - wheelW / 2, -Wd / 2 - wheelH * 0.32 + wheelH * 0.55, wheelW, wwH);
      ctx.fillRect(wx - wheelW / 2, Wd / 2 - wheelH * 0.68 + wheelH * 0.55, wheelW, wwH);
    }

    // tailfins — swept-back, Cadillac-style points at the rear corners,
    // drawn before the body so only their tips show past it, each capped
    // with a small red lens standing in for the integrated taillight
    // those fins actually carried. The single most recognizable 1950s
    // American-car cue in silhouette alone.
    ctx.fillStyle = car.color;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-L / 2 + L * 0.1, side * (Wd / 2 - Wd * 0.02));
      ctx.lineTo(-L / 2 - L * 0.16, side * (Wd / 2 + Wd * 0.2));
      ctx.lineTo(-L / 2 - L * 0.02, side * (Wd / 2 + Wd * 0.04));
      ctx.lineTo(-L / 2 + L * 0.04, side * (Wd / 2 - Wd * 0.1));
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#c23b2e";
      ctx.beginPath();
      ctx.arc(-L / 2 - L * 0.12, side * (Wd / 2 + Wd * 0.15), Wd * 0.06, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = car.color;
    }

    // body
    ctx.fillStyle = car.color;
    ctx.beginPath();
    ctx.roundRect(-L / 2, -Wd / 2, L, Wd, Wd * 0.36);
    ctx.fill();

    // two-tone lower panel — a contrasting cream sweep along the rocker,
    // the other half of the classic 1950s two-tone paint job (the cabin
    // panel below stands in for the contrasting roof color) — with a
    // bright chrome spear tracing the break between the two tones,
    // exactly the trim line every reference photo of the era shows.
    const spearY = Wd * 0.13;
    ctx.fillStyle = "#e8e2d0";
    ctx.beginPath();
    ctx.roundRect(-L / 2 + L * 0.03, spearY + Wd * 0.02, L - L * 0.06, Wd / 2 - Wd * 0.17, Wd * 0.1);
    ctx.fill();
    ctx.fillStyle = "#e4e7ea";
    ctx.fillRect(-L / 2 + L * 0.03, spearY, L - L * 0.06, Wd * 0.014);

    // cabin — a darker inset panel so the body reads as more than a block
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.roundRect(-L * 0.1, -Wd / 2 + Wd * 0.16, L * 0.4, Wd - Wd * 0.32, Wd * 0.18);
    ctx.fill();

    // chrome front bumper + wide grille bar, and a plainer chrome rear
    // bumper — the front end carries most of a '50s car's chrome, so it
    // gets more than a matching strip at both ends.
    ctx.fillStyle = "#d8dce0";
    ctx.fillRect(L / 2 - L * 0.02, -Wd * 0.32, L * 0.05, Wd * 0.64);
    ctx.fillRect(-L / 2 - L * 0.03, -Wd * 0.32, L * 0.05, Wd * 0.64);
    ctx.fillRect(L / 2 - L * 0.09, -Wd * 0.28, L * 0.05, Wd * 0.56);
    ctx.fillStyle = "rgba(20,20,23,0.5)";
    for (let i = -2; i <= 2; i++) {
      ctx.fillRect(L / 2 - L * 0.085, i * Wd * 0.1 - Wd * 0.01, L * 0.04, Wd * 0.02);
    }

    const lampW = L * 0.09, lampH = Wd * 0.26;

    // Turn signal — blinks the corner lamps on the turn side (local -y is
    // the car's left, +y its right; see carWorldPos's rotation math) for
    // as long as the car hasn't finished its turn arc yet. Stops as soon
    // as `pos` passes turnR, same as a real indicator cancelling once
    // the wheel straightens back out.
    const turning = car.turn !== "straight" && car.pos < car.turnR;
    const blinkOn = turning && Math.floor(performance.now() / 400) % 2 === 0;
    const blinkY = car.turn === "left" ? -1 : 1;

    // headlights, front corners
    for (const side of [-1, 1]) {
      const y = side < 0 ? -Wd / 2 + 1 : Wd / 2 - lampH - 1;
      if (blinkOn && side === blinkY) {
        ctx.fillStyle = "#ffb020";
        ctx.shadowColor = "#ffb020"; ctx.shadowBlur = SIZE * 0.012;
      } else {
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.shadowBlur = 0;
      }
      ctx.fillRect(L / 2 - lampW - 1, y, lampW, lampH);
    }
    ctx.shadowBlur = 0;

    // taillights, rear corners — dim red normally; while braking or sitting
    // stopped at a light they go bright AND throw a soft red glow onto the
    // road behind, so it reads unmistakably even from a glance across the
    // intersection (a plain shadowBlur was too subtle to notice at this
    // canvas's low pixel-art resolution).
    if (braking) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const glowR = Wd * 1.4;
      const glow = ctx.createRadialGradient(-L / 2, 0, 0, -L / 2, 0, glowR);
      glow.addColorStop(0, "rgba(224,101,79,0.32)");
      glow.addColorStop(0.45, "rgba(224,101,79,0.1)");
      glow.addColorStop(1, "rgba(224,101,79,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(-L / 2, 0, glowR, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (const side of [-1, 1]) {
      const y = side < 0 ? -Wd / 2 + 1 : Wd / 2 - lampH - 1;
      if (blinkOn && side === blinkY) {
        ctx.fillStyle = "#ffb020";
        ctx.shadowColor = "#ffb020"; ctx.shadowBlur = SIZE * 0.012;
      } else {
        ctx.fillStyle = braking ? "#e0654f" : "rgba(140,60,45,0.6)";
        ctx.shadowBlur = 0;
      }
      ctx.fillRect(-L / 2 - 1, y, lampW, lampH);
    }
    ctx.shadowBlur = 0;

    ctx.restore();

    if (car.waitTime > 0 && !car.latePenalized) {
      const remaining = Math.max(0, Math.ceil(10 - car.waitTime));
      const urgent = remaining <= 3;
      ctx.save();
      ctx.font = "700 11px 'JetBrains Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const by = wp.y; // right on the car itself, not floating above it
      const r = SIZE * 0.013;
      ctx.beginPath();
      ctx.arc(wp.x, by, r, 0, Math.PI * 2);
      ctx.fillStyle = urgent ? "rgba(255,77,79,0.85)" : "rgba(20,20,23,0.85)";
      ctx.fill();
      if (!urgent) {
        ctx.strokeStyle = css("--yellow");
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.fillStyle = urgent ? "#fff" : css("--yellow");
      ctx.fillText(String(remaining), wp.x, by + 1);
      ctx.textAlign = "start";
      ctx.textBaseline = "alphabetic";
      ctx.restore();
    }
  }
}

const FLOATER_RGB = {red: "224,101,79", green: "127,166,104"};

function drawFloaters() {
  ctx.font = "700 13px 'JetBrains Mono', monospace";
  ctx.textAlign = "center";
  for (const f of floaters) {
    const e = Math.min(1, f.t / 1.1);
    const y = f.y - e * SIZE * 0.05;
    const alpha = 1 - Math.max(0, (e - 0.55) / 0.45);
    ctx.fillStyle = `rgba(${FLOATER_RGB[f.color]},${alpha})`;
    ctx.fillText(f.text, f.x, y);
  }
  ctx.textAlign = "start";
}

function drawCrashBursts() {
  for (const b of crashBursts) {
    const alpha = Math.max(0, 1 - b.t / 0.6);
    if (alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = css("--yellow");
    ctx.lineWidth = SIZE * 0.005;
    const r1 = SIZE * 0.012, r2 = SIZE * 0.03 * (0.4 + b.t);
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(a) * r1, b.y + Math.sin(a) * r1);
      ctx.lineTo(b.x + Math.cos(a) * r2, b.y + Math.sin(a) * r2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function draw() {
  drawRoadSurface();
  drawSidewalks();
  drawBuildings();

  // Markings stay near-invisible by default — it's night, no ambient
  // street lighting — and only read clearly where a car's headlight
  // beam actually falls on them, redrawn at full strength clipped to
  // each cone below.
  ctx.save();
  ctx.globalAlpha = 0.28;
  drawRoadMarkings();
  ctx.restore();

  drawLightCones();

  for (const car of cars) {
    for (const {tipX, tipY, dx, dy, length, halfWidth} of carHeadlightGeom(car)) {
      const px = -dy, py = dx;
      const baseX = tipX + dx * length, baseY = tipY + dy * length;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(baseX + px * halfWidth, baseY + py * halfWidth);
      ctx.lineTo(baseX - px * halfWidth, baseY - py * halfWidth);
      ctx.closePath();
      ctx.clip();
      drawRoadMarkings();
      ctx.restore();
    }
  }

  drawCarHeadlightCones();
  drawCars();
  drawLights();
  drawFloaters();
  drawCrashBursts();
}

/* ---------------- Loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (paused ? 0 : speed);
  last = now;

  stepCars(dt);
  stepLights();
  draw();

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  for (const dir of DIRS) {
    const {x, y, r} = lightGeometry(dir);
    if (Math.hypot(mx - x, my - y) <= r * 1.3) { tapLight(dir); return; }
  }
});

document.getElementById("btn-pause").addEventListener("click", (e) => {
  paused = !paused;
  e.target.textContent = paused ? "Resume" : "Pause";
  e.target.setAttribute("aria-pressed", String(paused));
});
document.getElementById("btn-speed").addEventListener("click", (e) => {
  speed = speed === 1 ? 2.5 : 1;
  e.target.textContent = speed === 1 ? "2×" : "1×";
  e.target.setAttribute("aria-pressed", String(speed !== 1));
});

renderLeaderboard();
renderGlobalLeaderboard();
</script>

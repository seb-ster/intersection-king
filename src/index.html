<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intersection King</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            background: #0a0a0a;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = 1200;
        canvas.height = 1200;

        // Game constants
        const ROAD_WIDTH = 180;  // 3 lanes × 60px per car width
        const LANE_WIDTH = ROAD_WIDTH / 3;
        const CENTER = canvas.width / 2;
        const STOP_LINE_OFFSET = 30;  // Distance from intersection edge to stop line

        // Traffic light state
        const lights = {
            north: { state: 'red', yellowTimer: null },
            south: { state: 'red', yellowTimer: null },
            east: { state: 'red', yellowTimer: null },
            west: { state: 'red', yellowTimer: null }
        };

        const YELLOW_DURATION = 1500;  // Yellow light duration in milliseconds
        const VERSION = 'v0.2';
        let versionCopyTimer = null;
        let showVersionCopyLabel = false;

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grass
            ctx.fillStyle = '#1a5a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Horizontal road (top-bottom street)
            ctx.fillStyle = '#333';
            ctx.fillRect(
                0,
                CENTER - ROAD_WIDTH / 2,
                canvas.width,
                ROAD_WIDTH
            );

            // Vertical road (left-right street)
            ctx.fillStyle = '#333';
            ctx.fillRect(
                CENTER - ROAD_WIDTH / 2,
                0,
                ROAD_WIDTH,
                canvas.height
            );

            // Draw lane markings (dashed lines)
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 2;

            // Horizontal lane dividers
            for (let i = 1; i < 3; i++) {
                const y = CENTER - ROAD_WIDTH / 2 + (i * LANE_WIDTH);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Vertical lane dividers
            for (let i = 1; i < 3; i++) {
                const x = CENTER - ROAD_WIDTH / 2 + (i * LANE_WIDTH);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            ctx.setLineDash([]);

            // Draw intersection center marking
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);
            ctx.strokeRect(
                CENTER - ROAD_WIDTH / 2,
                CENTER - ROAD_WIDTH / 2,
                ROAD_WIDTH,
                ROAD_WIDTH
            );
            ctx.setLineDash([]);
        }

        function drawTrafficLight(x, y, state, orientation = 'vertical') {
            const bulbRadius = 12;
            const spacing = 30;
            const cassingPadding = 8;
            const colors = {
                red: '#e0654f',
                yellow: '#e8b23f',
                green: '#8fb878'
            };

            const bulbs = ['red', 'yellow', 'green'];

            if (orientation === 'vertical') {
                // Vertical housing (North/South)
                const casingWidth = bulbRadius * 2 + cassingPadding * 2;
                const casingHeight = spacing * 3 + cassingPadding * 2;

                ctx.fillStyle = '#d4a500';
                ctx.fillRect(x - casingWidth / 2, y - spacing * 1.5 - cassingPadding, casingWidth, casingHeight);

                ctx.strokeStyle = '#8b7500';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - casingWidth / 2, y - spacing * 1.5 - cassingPadding, casingWidth, casingHeight);

                // Draw pole
                ctx.fillStyle = '#333';
                ctx.fillRect(x - 4, y - spacing * 1.5, 8, spacing * 3);

                // Draw bulbs
                bulbs.forEach((color, i) => {
                    const bulbY = y - spacing + (i * spacing);
                    ctx.fillStyle = colors[color];
                    ctx.globalAlpha = color === state ? 1.0 : 0.2;
                    ctx.beginPath();
                    ctx.arc(x, bulbY, bulbRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = colors[color];
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                });
            } else if (orientation === 'horizontal') {
                // Horizontal housing (East/West) - rotated 90 degrees counter-clockwise
                const casingWidth = spacing * 3 + cassingPadding * 2;
                const casingHeight = bulbRadius * 2 + cassingPadding * 2;

                ctx.fillStyle = '#d4a500';
                ctx.fillRect(x - spacing * 1.5 - cassingPadding, y - casingHeight / 2, casingWidth, casingHeight);

                ctx.strokeStyle = '#8b7500';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - spacing * 1.5 - cassingPadding, y - casingHeight / 2, casingWidth, casingHeight);

                // Draw pole
                ctx.fillStyle = '#333';
                ctx.fillRect(x - spacing * 1.5, y - 4, spacing * 3, 8);

                // Draw bulbs horizontally (red on left, yellow middle, green on right)
                bulbs.forEach((color, i) => {
                    const bulbX = x - spacing + (i * spacing);
                    ctx.fillStyle = colors[color];
                    ctx.globalAlpha = color === state ? 1.0 : 0.2;
                    ctx.beginPath();
                    ctx.arc(bulbX, y, bulbRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = colors[color];
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                });
            }
        }

        function drawAllTrafficLights() {
            const stopLineOffset = STOP_LINE_OFFSET;
            const roadHalf = ROAD_WIDTH / 2;

            // North approach (top, vertical orientation)
            for (let i = 0; i < 3; i++) {
                const laneX = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightY = CENTER - roadHalf - stopLineOffset;
                drawTrafficLight(laneX, lightY, lights.north.state, 'vertical');
            }

            // South approach (bottom, vertical orientation)
            for (let i = 0; i < 3; i++) {
                const laneX = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightY = CENTER + roadHalf + stopLineOffset;
                drawTrafficLight(laneX, lightY, lights.south.state, 'vertical');
            }

            // East approach (right, horizontal orientation)
            for (let i = 0; i < 3; i++) {
                const laneY = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightX = CENTER + roadHalf + stopLineOffset;
                drawTrafficLight(lightX, laneY, lights.east.state, 'horizontal');
            }

            // West approach (left, horizontal orientation)
            for (let i = 0; i < 3; i++) {
                const laneY = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightX = CENTER - roadHalf - stopLineOffset;
                drawTrafficLight(lightX, laneY, lights.west.state, 'horizontal');
            }
        }

        function drawRoundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.arcTo(x + width, y, x + width, y + radius, radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.arcTo(x + width, y + height, x + width - radius, y + height, radius);
            ctx.lineTo(x + radius, y + height);
            ctx.arcTo(x, y + height, x, y + height - radius, radius);
            ctx.lineTo(x, y + radius);
            ctx.arcTo(x, y, x + radius, y, radius);
            ctx.closePath();
        }

        function drawVersionChip() {
            const padding = 12;
            const fontSize = 14;
            ctx.font = `${fontSize}px monospace`;
            const textWidth = ctx.measureText(VERSION).width;
            let chipWidth = textWidth + padding * 2;
            const chipHeight = fontSize + padding;
            const x = padding;
            const y = padding;
            const cornerRadius = chipHeight / 2;

            // Add extra width for "copied" label if shown
            let totalWidth = chipWidth;
            if (showVersionCopyLabel) {
                const copiedText = 'copied';
                const copiedWidth = ctx.measureText(copiedText).width;
                totalWidth = chipWidth + copiedWidth + padding * 2;
            }

            // Background with high contrast
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            drawRoundedRect(x, y, totalWidth, chipHeight, cornerRadius);
            ctx.fill();

            // Border with high contrast
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            drawRoundedRect(x, y, totalWidth, chipHeight, cornerRadius);
            ctx.stroke();

            // Version text with high contrast
            ctx.fillStyle = '#ffff00';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(VERSION, x + padding, y + padding / 2);

            // "Copied" label if shown
            if (showVersionCopyLabel) {
                const copiedText = 'copied';
                ctx.fillStyle = '#88ff00';
                ctx.fillText(copiedText, x + chipWidth + padding, y + padding / 2);
            }

            // Store chip bounds for click detection
            window.versionChipBounds = { x, y, width: totalWidth, height: chipHeight };
        }

        function update() {
            draw();
            drawAllTrafficLights();
            drawVersionChip();
        }

        function cycleState(currentState) {
            const cycle = ['red', 'yellow', 'green'];
            const currentIndex = cycle.indexOf(currentState);
            return cycle[(currentIndex + 1) % cycle.length];
        }

        function getClickedLight(x, y) {
            const stopLineOffset = STOP_LINE_OFFSET;
            const roadHalf = ROAD_WIDTH / 2;
            const clickRadius = 20;

            // Check north lights
            for (let i = 0; i < 3; i++) {
                const laneX = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightY = CENTER - roadHalf - stopLineOffset;
                if (Math.hypot(x - laneX, y - lightY) < clickRadius) {
                    return 'north';
                }
            }

            // Check south lights
            for (let i = 0; i < 3; i++) {
                const laneX = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightY = CENTER + roadHalf + stopLineOffset;
                if (Math.hypot(x - laneX, y - lightY) < clickRadius) {
                    return 'south';
                }
            }

            // Check east lights
            for (let i = 0; i < 3; i++) {
                const laneY = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightX = CENTER + roadHalf + stopLineOffset;
                if (Math.hypot(x - lightX, y - laneY) < clickRadius) {
                    return 'east';
                }
            }

            // Check west lights
            for (let i = 0; i < 3; i++) {
                const laneY = CENTER - roadHalf + (i + 0.5) * LANE_WIDTH;
                const lightX = CENTER - roadHalf - stopLineOffset;
                if (Math.hypot(x - lightX, y - laneY) < clickRadius) {
                    return 'west';
                }
            }

            return null;
        }

        function advanceLightState(direction) {
            const light = lights[direction];
            // Clear any existing timer
            if (light.yellowTimer) clearTimeout(light.yellowTimer);

            // Special handling: green goes to yellow (not directly to red)
            if (light.state === 'green') {
                light.state = 'yellow';
                // Auto-advance yellow to red after delay
                light.yellowTimer = setTimeout(() => {
                    light.state = 'red';
                    light.yellowTimer = null;
                    update();
                }, YELLOW_DURATION);
            } else {
                light.state = cycleState(light.state);

                // Auto-advance yellow to green after delay
                if (light.state === 'yellow') {
                    light.yellowTimer = setTimeout(() => {
                        light.state = 'green';
                        light.yellowTimer = null;
                        update();
                    }, YELLOW_DURATION);
                } else {
                    light.yellowTimer = null;
                }
            }

            update();
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check if version chip was clicked
            if (window.versionChipBounds) {
                const bounds = window.versionChipBounds;
                if (x >= bounds.x && x <= bounds.x + bounds.width &&
                    y >= bounds.y && y <= bounds.y + bounds.height) {
                    // Copy version to clipboard
                    navigator.clipboard.writeText(VERSION).then(() => {
                        showVersionCopyLabel = true;
                        update();
                        // Clear timer if exists
                        if (versionCopyTimer) clearTimeout(versionCopyTimer);
                        // Hide label after 2 seconds
                        versionCopyTimer = setTimeout(() => {
                            showVersionCopyLabel = false;
                            versionCopyTimer = null;
                            update();
                        }, 2000);
                    });
                    return;
                }
            }

            const clicked = getClickedLight(x, y);
            if (clicked) {
                advanceLightState(clicked);
            }
        });

        // Initial draw
        update();
    </script>
</body>
</html>
